<rect x="70" y="208" width="520" height="9" rx="5" fill="#3c6e71"/>
<text x="98" y="258" class="ui label" fill="#3c6e71">01 · EDITORIAL</text><text x="98" y="291" class="ui title" fill="#203236">차분한 에디토리얼</text>
