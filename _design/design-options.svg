<text x="111" y="493" class="ui small" fill="#54615e">개발</text><text x="111" y="526" class="ui small" fill="#54615e">기록</text><text x="111" y="559" class="ui small" fill="#54615e">생각</text>
<text x="246" y="424" class="ui small" fill="#73817d">기록을 쌓아가는 공간</text><text x="246" y="466" class="ui" font-size="25" font-weight="750" fill="#243a39">생각과 배움을 모읍니다</text>
<text x="246" y="495" class="ui small" fill="#677471">관심 있는 주제와 배운 내용을 차근차근 기록합니다.</text>
<line x1="246" y1="525" x2="550" y2="525" stroke="#e4e2dc"/>
<rect x="246" y="548" width="304" height="108" rx="8" fill="#fff" stroke="#e9e6de"/><text x="264" y="579" class="ui small" fill="#83908b">아직 글이 없습니다</text><text x="264" y="613" class="ui copy" font-weight="700" fill="#354d4a">첫 기록이 여기에 표시됩니다</text><text x="264" y="640" class="ui small" fill="#71807b">최근 글부터 차례로 보여드려요.</text>
<text x="98" y="1080" class="ui small" fill="#667">여백과 종이색으로 글 읽기에 집중</text>

