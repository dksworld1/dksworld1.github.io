<rect width="1800" height="1180" fill="#f2f4f7"/>
<text x="70" y="68" class="ui" font-size="14" font-weight="700" letter-spacing="3" fill="#526178">BLOG DESIGN DIRECTIONS</text>
<text x="70" y="122" class="ui" font-size="36" font-weight="750" fill="#17243a">좌측 카테고리 패널 · 디자인 선택지</text>
<text x="70" y="158" class="ui" font-size="16" fill="#68758a">현재 콘텐츠가 적은 초기 블로그를 기준으로 한 구조 시안입니다. 카테고리명은 예시입니다.</text>

<!-- option 1 -->
