  <style>
    .ui{font-family:'Segoe UI','Noto Sans KR',sans-serif}.label{font-size:16px;font-weight:700;letter-spacing:2px}.title{font-size:26px;font-weight:750}.heading{font-size:32px;font-weight:750}.copy{font-size:16px}.small{font-size:13px}.post{font-size:21px;font-weight:700}
