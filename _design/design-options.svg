<text x="829" y="419" class="ui small" fill="#71809e">MONDAY, 2026</text><text x="829" y="463" class="ui" font-size="26" font-weight="750" fill="#202c48">작은 발견을 기록합니다</text><text x="829" y="492" class="ui small" fill="#74809a">배운 것과 해본 일을 모아두는 개인 블로그.</text>
