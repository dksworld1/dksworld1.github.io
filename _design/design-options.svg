<text x="1403" y="419" class="ui small" fill="#a17d65">안녕하세요, 반가워요</text><text x="1403" y="464" class="ui" font-size="26" font-weight="750" fill="#49352e">천천히 모으는 배움과 생각</text><text x="1403" y="494" class="ui small" fill="#8b7568">좋아하는 것과 새로 알게 된 것을 기록합니다.</text>
<rect x="1403" y="527" width="283" height="171" rx="14" fill="#f2dfd1"/><circle cx="1650" cy="575" r="24" fill="#e7bea6"/><path d="M1620 627 Q1650 590 1680 627" fill="none" stroke="#c77b59" stroke-width="5" stroke-linecap="round"/><text x="1424" y="564" class="ui small" fill="#a16e54">오늘의 기록</text><text x="1424" y="606" class="ui" font-size="20" font-weight="750" fill="#694a39">첫 글을 기다리고 있어요</text><text x="1424" y="638" class="ui small" fill="#8b6d5b">새 글을 쓰면 이곳에 소개할게요.</text>
